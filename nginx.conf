server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión (el bundle baja de ~428 kB a ~128 kB)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los assets llevan hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea, así un redespliegue se ve al instante
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # One-pager: cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
