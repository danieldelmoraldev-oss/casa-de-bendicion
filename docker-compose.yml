# Despliegue estático con Docker (ver deploy.sh)
#   docker compose up -d      →  http://<servidor>:8082
services:
  casa-de-bendicion:
    image: nginx:alpine
    container_name: casa-de-bendicion
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
