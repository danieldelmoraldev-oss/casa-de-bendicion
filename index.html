<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C3661" />
    <!-- Dos iconos de pestaña: el isotipo positivo tiene el tejado en azul
         marino y se pierde sobre las barras oscuras del navegador, así que
         con el tema oscuro se sirve la versión negativa. El orden importa:
         un navegador que no entienda `media` se queda con el último, y la
         negativa al menos conserva la llama dorada visible sobre claro. -->
    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-oscuro.png" media="(prefers-color-scheme: dark)" />
    <title>Casa de Bendición – Más que iglesia, un movimiento</title>
    <meta
      name="description"
      content="Casa de Bendición es una comunidad cristiana en Yonkers y el Bronx, NY. Un lugar para creer, crecer, pertenecer y vivir el propósito de Dios."
    />
    <link rel="canonical" href="https://casadebendicionministries.org/" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, iMessage…).
         Estas etiquetas viven en el HTML servido, así que las leen aunque la
         web sea una aplicación de una sola página: esos rastreadores no
         ejecutan JavaScript, pero sí leen la cabecera.

         Sin ellas cogían lo primero que encontraban, que era el icono de
         pestaña, y el enlace salía con el isotipo gigante y recortado.

         La imagen va con URL absoluta: una ruta relativa no les vale. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Casa de Bendición" />
    <meta property="og:locale" content="es_US" />
    <meta property="og:url" content="https://casadebendicionministries.org/" />
    <meta property="og:title" content="Casa de Bendición – Más que iglesia, un movimiento" />
    <meta
      property="og:description"
      content="Comunidad cristiana en Yonkers y el Bronx, NY. Un lugar para creer, crecer, pertenecer y vivir el propósito de Dios."
    />
    <meta property="og:image" content="https://casadebendicionministries.org/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="La congregación de Casa de Bendición durante una reunión, con el identificador de la iglesia"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Casa de Bendición – Más que iglesia, un movimiento" />
    <meta
      name="twitter:description"
      content="Comunidad cristiana en Yonkers y el Bronx, NY. Un lugar para creer, crecer, pertenecer y vivir el propósito de Dios."
    />
    <meta name="twitter:image" content="https://casadebendicionministries.org/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
